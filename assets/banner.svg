<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="The Wind and the Kite — Shashank Mishra">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d29a"/>
      <stop offset="1" stop-color="#f8ebd0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="340" rx="14" fill="url(#sky)"/>

  <!-- sun + clouds -->
  <circle cx="1010" cy="120" r="70" fill="#f6c676" opacity=".55"/>
  <g fill="#fffaf0" opacity=".7" filter="url(#soft)">
    <ellipse cx="860" cy="90" rx="120" ry="34"/><ellipse cx="930" cy="70" rx="70" ry="30"/>
    <ellipse cx="180" cy="70" rx="110" ry="26"/><ellipse cx="560" cy="60" rx="90" ry="20"/>
  </g>

  <!-- dashed flight path with chapter dots -->
  <line x1="40" y1="28" x2="1160" y2="28" stroke="#2b2520" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g fill="#f7f0df" stroke="#2b2520" stroke-width="1.5">
    <circle cx="40" cy="28" r="6" fill="#2b2520"/><circle cx="227" cy="28" r="6"/><circle cx="413" cy="28" r="6"/><circle cx="600" cy="28" r="6"/>
    <circle cx="787" cy="28" r="6"/><circle cx="973" cy="28" r="6"/><circle cx="1160" cy="28" r="6"/>
  </g>
  <path d="M120 33 l26 -11 l-8 21 l-5 -8z" fill="#f7f0df" stroke="#2b2520" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- wind lines -->
  <g stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M640 150 q40 -10 80 0 t80 0"/><path d="M700 200 q40 -10 80 0 t80 0"/><path d="M560 110 q30 -8 60 0 t60 0"/>
  </g>

  <!-- rooftops -->
  <path d="M0 340 V262 H70 V248 H130 V270 H190 L215 244 L240 270 V258 H320 V276 H380 L410 250 L440 276 H520 V260 H600 V272 H680 V240 H700 V252 H770 V268 H840 L870 242 L900 268 H980 V256 H1060 V274 H1120 V250 H1200 V340Z" fill="#8a6a52" opacity=".9"/>
  <path d="M1000 256 l14 -44 l14 44z" fill="#6e5140"/><circle cx="1014" cy="210" r="4" fill="#c4673a"/>

  <!-- kite, string, tail -->
  <path d="M760 340 Q860 300 1010 172" fill="none" stroke="#2b2520" stroke-width="1.3" opacity=".6"/>
  <g transform="translate(1030 140) rotate(-22)">
    <path d="M0 -42 L28 0 L0 52 L-28 0Z" fill="#c4673a"/>
    <path d="M0 -42 L28 0 L0 52Z" fill="#a9532c" opacity=".55"/>
    <path d="M0 -42 V52 M-28 0 H28" stroke="#e7c9a2" stroke-width="1.6"/>
  </g>
  <path d="M1048 186 q12 16 30 10 t30 14 t28 8" fill="none" stroke="#c4673a" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#c4673a"><path d="M1074 196 l9 -4 l-2 8z"/><path d="M1104 208 l9 -3 l-3 8z"/><path d="M1130 217 l9 -2 l-3 7z"/></g>

  <!-- words -->
  <text x="80" y="92" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="22" fill="#c4673a">Once upon a time…</text>
  <text x="80" y="160" font-family="'IM Fell English','Iowan Old Style',Georgia,'Times New Roman',serif" font-size="62" fill="#2b2520">The Wind and the <tspan fill="#c4673a" font-style="italic">Kite</tspan></text>
  <text x="82" y="204" font-family="'Iowan Old Style',Georgia,'Times New Roman',serif" font-style="italic" font-size="24" fill="#5d5248">Shashank Mishra · engineer of systems that are not allowed to fall</text>
  <text x="82" y="236" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="18" fill="#c4673a">shashankmishra.bio</text>
</svg>
